<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Notebook</title>
<meta name="theme-color" content="#0f1730">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f1730;--panel:#131d38;--row:#1b2644;--line:#2a3858;--text:#e8ebf4;--mute:#8d99b8;--acc:#edc55a;--ink:#14203d;--sel:#26355e;color-scheme:dark}
*{box-sizing:border-box;scrollbar-color:var(--line) transparent}
html,body{height:100%;margin:0}
body{font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{background:var(--sel)}
::placeholder{color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
[style*="var(--acc)"]{color:var(--ink)!important}
#top{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:18px;color:var(--acc)}
#top .sp{flex:1}#top button{border:1px solid var(--line);color:var(--acc)}
#status{font-size:12px;color:var(--mute)}
#cols{flex:1;display:grid;grid-template-columns:repeat(3,minmax(180px,1fr)) minmax(0,2.4fr);gap:14px;padding:14px;min-height:0}
#nav{display:contents}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.card header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.card h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.card header button{color:var(--acc);font-size:16px;padding:2px 8px}
.rows{overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.rows>div{display:flex;align-items:baseline;gap:8px;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.rows>div:hover{border-color:var(--acc)}
.rows>div.on{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}
#nbList>div::before{content:"🗂️"}#tabs>div::before{content:"📁"}.pg::before{content:"📄"}
.tab{box-shadow:inset 4px 0 var(--c)}
.pg b{flex:1;min-width:0;font-weight:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg small{font-size:11px;opacity:.65}
#q{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--row);margin-bottom:8px}
.empty{color:var(--mute);padding:10px}
#edIn{flex:1;display:flex;flex-direction:column;min-height:0}
#tools{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:8px}
#tools button{min-width:32px;background:var(--row);border:1px solid var(--line)}
#tools button:hover{background:var(--sel)}
#back{display:none}
#title{border:0;background:none;font-size:26px;font-weight:600;padding:8px 2px 0;outline:0;width:100%}
#when{color:var(--mute);font-size:12px;padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
#body{flex:1;overflow:auto;padding:4px 2px 40px;outline:0}
#body h2{font-size:20px;margin:.6em 0 .2em;color:var(--acc)}
#body input[type=checkbox]{margin-right:8px;transform:scale(1.2);accent-color:var(--acc)}
#body [style*="background-color"],#body mark{color:var(--ink)}
#body table{border-collapse:collapse;margin:8px 0;max-width:100%}
#body td{border:1px solid var(--line);padding:6px 10px;min-width:70px;vertical-align:top}
#body a{color:var(--acc);text-decoration:underline;cursor:pointer;word-break:break-all}
#body img{max-width:100%;height:auto;border-radius:4px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);max-width:440px;width:92vw}
dialog::backdrop{background:rgba(5,9,22,.7)}
dialog label{display:block;margin:10px 0 2px;font-size:13px;color:var(--mute)}
dialog input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--row)}
dialog p{font-size:13px;color:var(--mute)}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#lock[hidden]{display:none}
#lock input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:260px;max-width:100%;background:var(--row)}
#lock button{background:var(--acc);color:var(--ink)}#lock #lockX{background:none;color:var(--text)}
#drw{max-width:740px}#drw canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;background:#fff}
.dt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.dt input[type=color]{width:38px;height:30px;padding:0}.dt input[type=range]{width:110px;padding:0}
@media(max-width:900px){#cols{display:flex;flex-direction:column;gap:10px;padding:10px}#nav{display:flex;gap:10px;overflow-x:auto;flex:none}#nav .card{flex:0 0 74vw;max-height:34vh}#ed{flex:1}#top h1{font-size:16px}#title{font-size:22px}}
#ws{flex:1;max-width:560px;margin:0 auto;display:flex;gap:6px}
#ws input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--row)}
#ws button{background:var(--acc);color:var(--ink);font-weight:600;border:0}
@media(max-width:900px){#top{flex-wrap:wrap}#ws{order:3;flex-basis:100%;max-width:none;margin:0}#status{margin-left:auto}}
</style>
</head>
<body>
<div id="top"><h1>My Notebook</h1><form id="ws" role="search"><input id="wq" type="search" placeholder="Search the web…" aria-label="Search the web" title="Opens Google results in a new browser tab"><button>Search ↗</button></form><span id="status"></span><button id="lockBtn">🔒 Lock</button><button id="cfgBtn">Sync</button></div>
<div id="cols">
  <div id="nav">
    <section class="card"><header><h3>Notebooks</h3><span><button id="nbAdd" title="New notebook">＋</button><button id="nbMenu" title="Rename or delete notebook">⋯</button></span></header><div id="nbList" class="rows"></div></section>
    <section class="card"><header><h3>Sections</h3><span><button id="secAdd" title="New section">＋</button><button id="secMenu" title="Rename or delete section">⋯</button></span></header><div id="tabs" class="rows"></div></section>
    <section class="card"><header><h3>Tabs</h3><span><button id="pgAdd" title="New tab">＋</button><button id="pgDel" title="Delete tab">🗑</button></span></header><input id="q" type="search" placeholder="Search this notebook"><div id="pages" class="rows"></div></section>
  </div>
  <section id="ed" class="card"><header><h3>Content</h3></header>
    <div id="edIn">
      <div id="tools"><button id="back">Back</button>
        <button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><button data-c="strikeThrough"><s>S</s></button>
        <button data-c="formatBlock" data-v="h2">Heading</button><button data-c="formatBlock" data-v="p">Text</button>
        <button data-c="insertUnorderedList">• List</button><button data-c="insertOrderedList">1. List</button>
        <button id="chk">☐ To-do</button><button id="hl">Highlight</button><button id="imgBtn">Image</button><button id="drawBtn">Draw</button>
        <button data-t="new">Table</button><button data-t="row">+ Row</button><button data-t="col">+ Column</button><button data-t="del">Delete table</button></div>
      <input id="title" placeholder="Untitled tab" aria-label="Tab title">
      <div id="when"></div>
      <div id="body" contenteditable="true" spellcheck="true" aria-label="Tab content"></div>
    </div>
  </section>
</div>

<form id="lock" hidden><h2 id="lockMsg" style="margin:0;max-width:340px">Enter your password</h2><input id="lockPw" type="password" autocomplete="current-password" aria-label="Password"><div><button>Unlock</button> <button type="button" id="lockX">Cancel</button></div></form>
<input type="file" id="imgIn" accept="image/*" multiple hidden>
<dialog id="drw"><form method="dialog">
  <div class="dt"><button type="button" id="dpen">✏️ Pen</button><button type="button" id="der">Eraser</button><input id="dc" type="color" value="#201f24" aria-label="Color"><input id="dw" type="range" min="1" max="24" value="3" aria-label="Size"><button type="button" id="dclr">Clear</button></div>
  <canvas id="cv" width="700" height="420"></canvas>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button value="x">Cancel</button><button type="button" id="dins" style="background:var(--acc);color:#fff">Insert drawing</button></div>
</form></dialog>
<dialog id="cfg"><form method="dialog">
  <h3 style="margin-top:0">Sync across devices</h3>
  <p>Notes always save on this device. To use them on other devices, add a private GitHub repo and an access token. Do this once on every device.</p>
  <label>Data repo (owner/name)</label><input id="cRepo" placeholder="yourname/my-notes-data">
  <label>Access token</label><input id="cTok" type="password" placeholder="github_pat_…">
  <p id="cMsg"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button value="x">Close</button><button type="button" id="cSave" style="background:var(--acc);color:#fff">Save &amp; sync</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,9);
const COL=['#7719aa','#0f6cbd','#107c10','#d83b01','#b4009e','#008272'];
let S,cur={nb:0,sec:0,pg:null},sha=null,timer=null,busy=false;

const fresh=()=>({updated:0,nbs:[{id:uid(),name:'My Notebook',secs:[{id:uid(),name:'Quick Notes',color:COL[0],pgs:[{id:uid(),title:'Welcome',t:Date.now(),html:'<p>Click here and start typing. Use the toolbar for headings, lists and to-dos.</p><p>Open <b>Sync</b> (top right) to use these notes on all your devices.</p>'}]}]}]});
async function load(){const raw=localStorage.getItem('nb');try{if(raw)S=await unpack(raw)}catch(e){}if(!S||!S.nbs||!S.nbs.length)S=fresh()}
const cfg=()=>{try{return JSON.parse(localStorage.getItem('nbcfg'))||{}}catch(e){return{}}};
const NB=()=>S.nbs[cur.nb]||S.nbs[0], SEC=()=>NB().secs[cur.sec]||NB().secs[0], PG=()=>SEC()&&SEC().pgs.find(p=>p.id===cur.pg);
const status=t=>$('#status').textContent=t;

async function save(){S.updated=Date.now();try{localStorage.setItem('nb',await pack(S))}catch(e){status('Device storage full – delete images')}clearTimeout(timer);timer=setTimeout(push,1500);}

/* ---------- GitHub sync ---------- */
const enc=s=>btoa(unescape(encodeURIComponent(s))), dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function api(method,body,raw){const c=cfg();return fetch(`https://api.github.com/repos/${c.repo}/contents/notes.json`,{method,headers:{Authorization:'Bearer '+c.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'},body:body&&JSON.stringify(body)})}
async function pull(){
  const c=cfg();if(!c.repo||!c.token){status('Saved on this device');return}
  try{status('Syncing…');const r=await api('GET');
    if(r.status===404){sha=null;await push();return}
    if(!r.ok)throw 0;const j=await r.json();sha=j.sha;const remote=await unpack(j.content?dec(j.content):await(await api('GET',null,1)).text());
    if(remote.updated>S.updated){S=remote;localStorage.setItem('nb',await pack(S));fix();render()}
    else if(remote.updated<S.updated)await push();
    status('Synced ✓')}catch(e){status('Sync failed – check Sync settings')}
}
async function push(){
  const c=cfg();if(!c.repo||!c.token||busy){if(!c.repo)status('Saved on this device');return}
  busy=true;
  try{status('Syncing…');
    const body={message:'Update notes',content:enc(await pack(S))};if(sha)body.sha=sha;
    let r=await api('PUT',body);
    if(r.status===409||r.status===422){const g=await api('GET');if(g.ok){sha=(await g.json()).sha;body.sha=sha;r=await api('PUT',body)}}
    if(!r.ok)throw 0;sha=(await r.json()).content.sha;status('Synced ✓')}
  catch(e){status('Sync failed – will retry')}
  busy=false;
}

/* ---------- rendering ---------- */
function fix(){if(cur.nb>=S.nbs.length)cur.nb=0;if(cur.sec>=NB().secs.length)cur.sec=0;const s=SEC();if(s&&!s.pgs.find(p=>p.id===cur.pg))cur.pg=s.pgs[0]?s.pgs[0].id:null}
function render(){
  $('#nbList').innerHTML=S.nbs.map((n,i)=>`<div class="${i==cur.nb?'on':''}" data-i="${i}">${esc(n.name)}</div>`).join('');
  $('#tabs').innerHTML=NB().secs.map((s,i)=>`<div class="tab ${i==cur.sec?'on':''}" style="--c:${s.color}" data-i="${i}">${esc(s.name)}</div>`).join('');
  renderList();renderEditor();
}
function renderList(){
  const q=$('#q').value.trim().toLowerCase();let items;
  if(q){items=[];NB().secs.forEach((s,si)=>s.pgs.forEach(p=>{if((p.title+' '+strip(p.html)).toLowerCase().includes(q))items.push({p,si,s})}))}
  else items=(SEC()?SEC().pgs:[]).map(p=>({p,si:cur.sec,s:SEC()}));
  $('#pages').innerHTML=items.length?items.map(({p,si,s})=>`<div class="pg ${p.id==cur.pg?'on':''}" data-id="${p.id}" data-si="${si}"><b>${esc(p.title||'Untitled tab')}</b><small>${q?esc(s.name)+' · ':''}${new Date(p.t).toLocaleDateString()}</small></div>`).join(''):'<div class="empty">No tabs yet. Select ＋ to add one.</div>';
}
function renderEditor(){
  const p=PG();$('#edIn').style.visibility=p?'visible':'hidden';if(!p)return;
  $('#title').value=p.title;$('#body').innerHTML=p.html;
  $('#when').textContent=new Date(p.t).toLocaleString([], {dateStyle:'full',timeStyle:'short'});
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};

/* ---------- events ---------- */
$('#nbList').onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;cur.nb=+d.dataset.i;cur.sec=0;cur.pg=null;$('#q').value='';fix();render()};
$('#nbAdd').onclick=()=>{const n=prompt('Notebook name');if(!n)return;S.nbs.push({id:uid(),name:n,secs:[{id:uid(),name:'New Section',color:COL[0],pgs:[]}]});cur={nb:S.nbs.length-1,sec:0,pg:null};save();render()};
$('#nbMenu').onclick=()=>{const a=prompt('Type a new name to rename this notebook, or type DELETE to remove it.',NB().name);if(!a)return;
  if(a==='DELETE'){if(S.nbs.length<2)return alert('Keep at least one notebook.');if(!confirm('Delete this notebook and all its pages?'))return;S.nbs.splice(cur.nb,1);cur={nb:0,sec:0,pg:null}}else NB().name=a;save();fix();render()};
$('#tabs').onclick=e=>{
  if(e.target.id==='secAdd'){const n=prompt('Section name');if(!n)return;NB().secs.push({id:uid(),name:n,color:COL[NB().secs.length%COL.length],pgs:[]});cur.sec=NB().secs.length-1;cur.pg=null;save();render();return}
  const t=e.target.closest('.tab');if(t){cur.sec=+t.dataset.i;cur.pg=null;$('#q').value='';fix();render()}};
$('#secMenu').onclick=()=>{const a=prompt('Type a new name to rename this section, or type DELETE to remove it.',SEC().name);if(!a)return;
  if(a==='DELETE'){if(NB().secs.length<2)return alert('Keep at least one section.');if(!confirm('Delete this section and its pages?'))return;NB().secs.splice(cur.sec,1);cur.sec=0;cur.pg=null}else SEC().name=a;save();fix();render()};
$('#pgAdd').onclick=()=>{const p={id:uid(),title:'',html:'<p><br></p>',t:Date.now()};SEC().pgs.unshift(p);cur.pg=p.id;$('#q').value='';save();render();document.body.classList.add('edit');$('#title').focus()};
$('#pgDel').onclick=()=>{if(!PG()||!confirm('Delete this tab?'))return;const s=SEC();s.pgs=s.pgs.filter(p=>p.id!==cur.pg);cur.pg=null;save();fix();render();document.body.classList.remove('edit')};
$('#pages').onclick=e=>{const d=e.target.closest('.pg');if(!d)return;cur.sec=+d.dataset.si;cur.pg=d.dataset.id;render();document.body.classList.add('edit')};
$('#back').onclick=()=>document.body.classList.remove('edit');
$('#q').oninput=renderList;
$('#title').oninput=e=>{const p=PG();p.title=e.target.value;p.t=Date.now();save();renderList()};
$('#body').oninput=()=>{const p=PG();p.html=$('#body').innerHTML;p.t=Date.now();save()};
$('#body').onclick=e=>{if(e.target.type==='checkbox'){e.target.toggleAttribute('checked',e.target.checked);$('#body').oninput()}};
$('#tools').onmousedown=e=>{if(e.target.closest('button')&&e.target.id!=='back'&&!/secMenu|pgDel/.test(e.target.id))e.preventDefault()};
$('#tools').onclick=e=>{const b=e.target.closest('button[data-c]');if(!b)return;document.execCommand(b.dataset.c,false,b.dataset.v||null);$('#body').oninput()};
$('#chk').onclick=()=>{document.execCommand('insertHTML',false,'<input type="checkbox">&nbsp;');$('#body').oninput()};
$('#hl').onclick=()=>{document.execCommand('hiliteColor',false,'#ffe55c');$('#body').oninput()};
$('#cfgBtn').onclick=()=>{const c=cfg();$('#cRepo').value=c.repo||'';$('#cTok').value=c.token||'';$('#cMsg').textContent='';$('#cfg').showModal()};
$('#cSave').onclick=async()=>{localStorage.setItem('nbcfg',JSON.stringify({repo:$('#cRepo').value.trim(),token:$('#cTok').value.trim()}));sha=null;$('#cMsg').textContent='Connecting…';
  await pull();$('#cMsg').textContent=$('#status').textContent;if($('#status').textContent.includes('✓'))setTimeout(()=>$('#cfg').close(),700)};
addEventListener('beforeunload',()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

/* ---------- password lock (AES-GCM, key from password via PBKDF2) ---------- */
let PW=null,keys={};
const b64=u=>{const a=new Uint8Array(u);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(salt){if(keys[salt])return keys[salt];const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(PW),'PBKDF2',false,['deriveKey']);return keys[salt]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function pack(o){const j=JSON.stringify(o);if(!PW)return j;const salt=localStorage.getItem('nbsalt'),iv=crypto.getRandomValues(new Uint8Array(12));const d=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(salt),new TextEncoder().encode(j));return JSON.stringify({enc:1,s:salt,iv:b64(iv),d:b64(d)})}
async function unpack(str){const o=JSON.parse(str);if(!o.enc)return o;let m='Enter your password';
  while(true){if(!PW)PW=await askPW(m);try{const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await key(o.s),unb64(o.d));localStorage.setItem('nbsalt',o.s);return JSON.parse(new TextDecoder().decode(p))}catch(e){PW=null;keys={};m='Wrong password. Try again.'}}}
const askPW=(msg,cancel)=>new Promise(r=>{$('#lockMsg').textContent=msg||'Enter your password';$('#lockX').hidden=!cancel;$('#lock').hidden=false;$('#lockPw').value='';$('#lockPw').focus();
  $('#lock').onsubmit=e=>{e.preventDefault();const v=$('#lockPw').value;if(!v)return;$('#lockPw').value='';$('#lock').hidden=true;r(v)};
  $('#lockX').onclick=()=>{$('#lock').hidden=true;r(null)}});
async function setPW(){const a=await askPW('Choose a password. If you forget it, your notes cannot be recovered.',1);if(!a)return;const b=await askPW('Type the password again',1);if(!b)return;if(a!==b)return alert('The passwords did not match.');
  PW=a;keys={};localStorage.setItem('nbsalt',b64(crypto.getRandomValues(new Uint8Array(16))));await save();status('Password lock is on')}
$('#lockBtn').onclick=async()=>{
  if(!PW)return setPW();
  const a=(prompt('Type LOCK to lock now, CHANGE to set a new password, or REMOVE to turn the lock off.')||'').trim().toUpperCase();
  if(a==='LOCK')location.reload();else if(a==='CHANGE')setPW();else if(a==='REMOVE'){PW=null;keys={};await save();status('Password lock is off')}};

/* ---------- insert helpers, images, drawing, tables ---------- */
let rng=null;
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&$('#body').contains(s.anchorNode))rng=s.getRangeAt(0).cloneRange()});
function ins(h){const b=$('#body');b.focus();if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}document.execCommand('insertHTML',false,h);b.oninput()}
function addImg(f){const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas'),x=c.getContext('2d');c.width=im.width*k;c.height=im.height*k;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ins('<img src="'+c.toDataURL('image/jpeg',.72)+'"><p><br></p>')};im.src=u}
$('#imgBtn').onclick=()=>$('#imgIn').click();
$('#imgIn').onchange=e=>{[...e.target.files].forEach(addImg);e.target.value=''};
const linkify=t=>{let o='',i=0;t.replace(/(https?:\/\/|www\.)[^\s<>"']+/gi,(m,_p,off)=>{const u=m.replace(/[.,;:!?)\]]+$/,'');o+=esc(t.slice(i,off))+'<a href="'+esc(/^www\./i.test(u)?'https://'+u:u)+'" target="_blank" rel="noopener noreferrer">'+esc(u)+'</a>';i=off+u.length;return m});return(o+esc(t.slice(i))).replace(/\r?\n/g,'<br>')};
$('#body').onpaste=e=>{const d=e.clipboardData,f=[...d.files].filter(x=>x.type.startsWith('image/'));
  if(f.length){e.preventDefault();f.forEach(addImg);return}
  const t=d.getData('text/plain');
  if(/(https?:\/\/|www\.)\S/i.test(t)&&!/<a\s/i.test(d.getData('text/html'))){e.preventDefault();ins(linkify(t))}};
$('#body').addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a){e.preventDefault();if(/^https?:/i.test(a.href))window.open(a.href,'_blank','noopener')}});
$('#body').ondblclick=e=>{if(e.target.tagName==='IMG'&&confirm('Remove this image?')){e.target.remove();$('#body').oninput()}};

const dv=$('#cv'),dx=dv.getContext('2d');let dn=false,er=false;
const dclear=()=>{dx.fillStyle='#fff';dx.fillRect(0,0,dv.width,dv.height)};
const pt=e=>{const r=dv.getBoundingClientRect();return[(e.clientX-r.left)*dv.width/r.width,(e.clientY-r.top)*dv.height/r.height]};
function dr(e,first){const p=pt(e);dx.lineCap=dx.lineJoin='round';dx.lineWidth=$('#dw').value*(er?4:1);dx.strokeStyle=er?'#fff':$('#dc').value;if(first){dx.beginPath();dx.moveTo(p[0],p[1])}dx.lineTo(p[0]+(first?.1:0),p[1]);dx.stroke()}
dv.onpointerdown=e=>{dn=true;dv.setPointerCapture(e.pointerId);dr(e,true)};
dv.onpointermove=e=>{if(dn)dr(e)};
dv.onpointerup=dv.onpointercancel=()=>dn=false;
$('#drawBtn').onclick=()=>{dclear();er=false;$('#drw').showModal()};
$('#dpen').onclick=()=>er=false;$('#der').onclick=()=>er=true;$('#dclr').onclick=dclear;
$('#dins').onclick=()=>{$('#drw').close();ins('<img src="'+dv.toDataURL('image/png')+'"><p><br></p>')};

const cell=()=>{const n=getSelection().anchorNode;return n&&(n.nodeType==3?n.parentNode:n).closest('td')};
function tbl(a){
  if(a==='new'){const v=(prompt('Rows x columns','3x3')||'').toLowerCase().split('x').map(Number),r=v[0],c=v[1];if(!(r>0&&c>0&&r<50&&c<12))return;ins('<table>'+('<tr>'+'<td><br></td>'.repeat(c)+'</tr>').repeat(r)+'</table><p><br></p>');return}
  const td=cell();if(!td||!$('#body').contains(td))return alert('Click inside a table cell first.');
  const tr=td.parentNode,t=tr.closest('table');
  if(a==='row'){const n=tr.cloneNode(true);n.querySelectorAll('td').forEach(x=>x.innerHTML='<br>');tr.after(n)}
  if(a==='col'){const i=td.cellIndex;t.querySelectorAll('tr').forEach(r=>{const c=document.createElement('td');c.innerHTML='<br>';r.cells[i].after(c)})}
  if(a==='del'){if(!confirm('Delete this table?'))return;t.remove()}
  $('#body').oninput()}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)tbl(b.dataset.t)});

$('#ws').onsubmit=e=>{e.preventDefault();const q=$('#wq').value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener')};
$('#secAdd').onclick=()=>$('#tabs').onclick({target:$('#secAdd')});
(async()=>{await load();fix();render();pull()})();
</script>
</body>
